<style>
:root{color-scheme:dark;--bg:#12101f;--fg:#f1f0ff;--bt:#2a2650;--ac:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.sub{opacity:.7;margin:0 0 14px}

.card{border:0;border-radius:12px;padding:12px 10px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:92px;position:relative}
.card b{font-size:26px;line-height:1}.card span{font-size:14px}.card i{font-style:normal;color:var(--ac);font-size:11px;letter-spacing:0;white-space:nowrap}

.wide{grid-column:1/3;background:var(--bt)}
#game{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;max-width:520px}

canvas{width:100%;aspect-ratio:9/16;border-radius:10px;touch-action:none;background:#000;display:block}
#end,#pz{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border-radius:10px}

<script>
const Core=(function(){
const C=40,S=36,GY=560,ROWS=12,H=1/120,V=300,GR=2600,JV=-720,PV=-950,CT=GY-ROWS*C;
const key=(x,y)=>x+','+y;
const hit=(x,y,w,h,bx,by,bw,bh)=>x<bx+bw&&x+w>bx&&y<by+bh&&y+h>by;
function expand(rects){const m=new Map();for(const [x,y,w,h,t] of rects)for(let i=0;i<w;i++)for(let j=0;j<h;j++)m.set(key(x+i,y+j),t);return m}
function endX(m){let mx=20;for(const k of m.keys())mx=Math.max(mx,+k.split(',')[0]);return (mx+6)*C}
function newState(m){return {x:0,y:GY-S,vy:0,og:true,rot:0,end:endX(m),pad:0,dead:false,won:false,mode:0,got:[]}}
function cells(P,m,fn){
 const a=Math.floor(P.x/C)-1,b=Math.floor((P.x+S)/C)+1;
 for(let cx=a;cx<=b;cx++)for(let cy=0;cy<ROWS;cy++){const t=m.get(key(cx,cy));if(t&&!P.dead)fn(t,cx*C,GY-(cy+1)*C)}}
function setMode(P,t){const n=t==4?1:t==6?2:0;if(n!=P.mode){P.mode=n;P.rot=0;P.og=false;if(n==2)P.vy=0;if(n==1)P.vy=Math.max(-340,Math.min(340,P.vy))}}
const portal=(P,t,bx,by)=>(t==4||t==5||t==6)&&hit(P.x,P.y,S,S,bx+12,by,16,C);
function ship(P,m,hold){
 P.vy=Math.max(-340,Math.min(340,P.vy+(hold?-1900:1500)*H));
 const pt=P.y,pb=P.y+S;P.y+=P.vy*H;P.og=false;
 if(P.y+S>=GY){P.y=GY-S;P.vy=Math.min(P.vy,0)}
 if(P.y<CT){P.y=CT;P.vy=Math.max(P.vy,0)}
 cells(P,m,(t,bx,by)=>{if(t==1&&hit(P.x,P.y,S,S,bx,by,C,C)){
  if(P.vy>=0&&pb<=by+.5){P.y=by-S;P.vy=0}else if(P.vy<=0&&pt>=by+C-.5){P.y=by+C;P.vy=0}else P.dead=true}});
 P.x+=V*H;
 cells(P,m,(t,bx,by)=>{
  if(t==1&&hit(P.x,P.y,S,S,bx,by,C,C)){
   if(P.vy>=0&&P.y+S-by<=6){P.y=by-S;P.vy=0}else if(P.vy<=0&&by+C-P.y<=6){P.y=by+C;P.vy=0}else P.dead=true}
  else if(t==2&&hit(P.x+3,P.y+3,S-6,S-6,bx+13,by+14,14,26))P.dead=true;
  else if(portal(P,t,bx,by))setMode(P,t)});
 P.rot=Math.max(-.5,Math.min(.5,P.vy/600));
 if(P.x>P.end)P.won=true}
function wave(P,m,hold){const W=14,o=(S-W)/2;
 P.vy=hold?-V:V;P.y+=P.vy*H;P.og=false;
 if(P.y+S>=GY)P.y=GY-S;if(P.y<CT)P.y=CT;
 P.x+=V*H;
 cells(P,m,(t,bx,by)=>{
  if(t==1&&hit(P.x+o,P.y+o,W,W,bx,by,C,C))P.dead=true;
  else if(t==2&&hit(P.x+o,P.y+o,W,W,bx+13,by+14,14,26))P.dead=true;
  else if(portal(P,t,bx,by))setMode(P,t)});
 P.rot=hold?-.6:.6;
 if(P.x>P.end)P.won=true}
function step(P,m,hold){
 if(P.dead||P.won)return;
 if(P.pad>0)P.pad--;
 if(P.mode==1)return ship(P,m,hold);
 if(P.mode==2)return wave(P,m,hold);
 if(P.og&&hold){P.vy=JV;P.og=false}
 const pb=P.y+S;
 P.vy+=GR*H;P.y+=P.vy*H;P.og=false;
 if(P.y+S>=GY){P.y=GY-S;P.vy=0;P.og=true}
 cells(P,m,(t,bx,by)=>{
  if(t==1&&hit(P.x,P.y,S,S,bx,by,C,C)){
   if(pb<=by+.5&&P.vy>=0){P.y=by-S;P.vy=0;P.og=true}else P.dead=true}});
 P.x+=V*H;
 cells(P,m,(t,bx,by)=>{
  if(t==1&&hit(P.x,P.y,S,S,bx,by,C,C)){
   if(P.vy>=0&&P.y+S-by<=6){P.y=by-S;P.vy=0;P.og=true}else P.dead=true}
  else if(t==2&&hit(P.x+3,P.y+3,S-6,S-6,bx+13,by+14,14,26))P.dead=true;
  else if(t==3&&!P.pad&&hit(P.x,P.y,S,S,bx,by+32,C,8)){P.vy=PV;P.og=false;P.pad=12}
  else if(portal(P,t,bx,by))setMode(P,t)});
 if(P.mode==0){if(P.og)P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);else P.rot+=H*7}
 if(P.x>P.end)P.won=true;
}
function coins(P,m){const a=Math.floor(P.x/C)-1,b=Math.floor((P.x+S)/C)+1;
 for(let cx=a;cx<=b;cx++)for(let cy=0;cy<ROWS;cy++){if(m.get(key(cx,cy))==7){const k=key(cx,cy);if(!P.got.includes(k)&&hit(P.x,P.y,S,S,cx*C+4,GY-(cy+1)*C+4,32,32))P.got.push(k)}}}
return {C,S,GY,ROWS,H,key,expand,newState,step,coins};
})();

function dailyExpire(){const o=COLS.find(x=>x.d&&x.c==skin.c);if(o&&!colOpen(o)){skin.c='#ffd23f';saveSkin()}}
function dailyClaim(){if(dailyLeft()>0)return null;
 let r=Math.random()*DREW.reduce((s,x)=>s+x.w,0),x=DREW[0];for(const y of DREW){if((r-=y.w)<0){x=y;break}}
 let res={t:x.t,rare:!!x.rare,ic:'🔵'};
 if(x.coins)prog.coins+=x.coins;
 else if(x.cp){prog.cp+=1;res.ic='📍'}
 else{const s=DSK[Math.floor(Math.random()*DSK.length)];res.ic='🎨';res.c=s.c;
  if(s.perm){if(prog.dp.includes(s.c)){prog.coins+=10;res={t:'10 étoiles 🔵 (skin déjà possédé)',rare:false,ic:'🔵'}}else{prog.dp.push(s.c);res.t='Skin permanent : '+s.n;res.rare=true}}
  else{prog.tc[s.c]=Math.max(Date.now(),prog.tc[s.c]||0)+3*DAYMS;res.t='Skin temporaire (3 jours) : '+s.n}}
 prog.dl={t:Date.now(),last:res};save();return res}
function buildDaily(gr){const left=dailyLeft(),ok=left<=0,last=prog.dl&&prog.dl.last,d=document.createElement('div');d.className='daily'+(ok?'':' done');
 d.innerHTML='<div class="gift">'+(ok?'🎁':'📦')+'</div><h3>Offre quotidienne gratuite</h3><div style="font-size:13px;opacity:.9">5 · 10 · 20 étoiles 🔵 (rare) · checkpoint 📍 · skin 🎨</div>'
  +(last?'<div style="font-size:12px;opacity:.8;margin-top:8px">Dernière récompense</div><div class="rw'+(last.rare?' rare':'')+'">'+last.ic+' '+last.t+(last.c?' <span style="display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:middle;background:'+last.c+'"></span>':'')+'</div>':'')+'<div id="dbox" style="margin-top:10px"></div>';
 gr.appendChild(d);const bx=d.querySelector('#dbox');
 if(ok){const b=document.createElement('button');b.className='claim';b.textContent='Récupérer';b.onclick=()=>{if(dailyClaim())buildMenu()};bx.appendChild(b)}
 else{const c=document.createElement('div');c.id='dcd';c.style.fontWeight='700';c.textContent='Prochaine offre dans '+fmtT(left);bx.appendChild(c)}}
setInterval(()=>{if(tab!='shop'||$('menu').classList.contains('hide'))return;const l=dailyLeft(),el=$('dcd');if(el){if(l<=0){buildMenu();return}el.textContent='Prochaine offre dans '+fmtT(l)}},1000);
let bgT=0;
const EMO=['⭐','🫧','💎','🌅','🏙️','⚡','🌊','🔥','🪐','👑'];
const rr=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const wx=(x,w)=>((x%w)+w)%w;
function mtn(par,cm,h,al,sd){g.globalAlpha=al;g.fillStyle='#000';g.beginPath();g.moveTo(0,GY);
 for(let x=0;x<=GW;x+=12){const u=x+cm*par;g.lineTo(x,GY-h*(.45+.3*Math.sin(u/70+sd)+.25*Math.sin(u/27+sd*2)))}
 g.lineTo(GW,GY);g.fill();g.globalAlpha=1}
function drawBg(cm){
 const tm=performance.now(),col=theme[2],t=bgT;
 const hg=g.createLinearGradient(0,GY-220,0,GY);hg.addColorStop(0,'rgba(255,255,255,0)');hg.addColorStop(1,col);
 g.globalAlpha=.28;g.fillStyle=hg;g.fillRect(0,GY-220,GW,220);g.globalAlpha=1;
 if([0,3,5,7,8,9].includes(t)){for(let i=0;i<45;i++){const x=wx(rr(i*3+1)*(GW+40)-cm*(i%2?.06:.12),GW+40)-20,y=rr(i*3+2)*(GY-150)+8;
  g.globalAlpha=.35+.65*Math.abs(Math.sin(tm/500+i));g.fillStyle='#fff';g.fillRect(x,y,i%3?2:3,i%3?2:3)}g.globalAlpha=1}
 switch(t){
 case 0:{g.globalAlpha=.9;g.fillStyle='#fff6d6';g.beginPath();g.arc(280,95,30,0,7);g.fill();g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.arc(272,88,7,0,7);g.fill();g.beginPath();g.arc(290,104,5,0,7);g.fill();g.globalAlpha=1;break}
 case 1:{for(let i=0;i<16;i++){const x=wx(rr(i)*(GW+80)-cm*(.1+rr(i+9)*.2),GW+80)-40,y=GY-((tm*(.012+rr(i+3)*.02)+rr(i+5)*GY)%GY),r=8+rr(i+7)*24;
  g.globalAlpha=.3;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.globalAlpha=.08;g.fillStyle='#fff';g.fill()}g.globalAlpha=1;break}
 case 2:{for(let i=0;i<14;i++){const x=wx(rr(i)*(GW+100)-cm*(.1+rr(i+4)*.25),GW+100)-50,y=rr(i+2)*(GY-60),s=14+rr(i+6)*34;
  g.save();g.translate(x,y);g.rotate(Math.PI/4+tm/6000*(i%2?1:-1));g.globalAlpha=.16;g.fillStyle=col;g.fillRect(-s/2,-s/2,s,s);g.globalAlpha=.4;g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(-s/2,-s/2,s,s);g.restore()}g.globalAlpha=1;break}
 case 3:{const sg=g.createRadialGradient(GW/2,GY-80,5,GW/2,GY-80,95);sg.addColorStop(0,'#fff3b0');sg.addColorStop(.5,'#ffd166');sg.addColorStop(1,'rgba(255,107,107,0)');
  g.fillStyle=sg;g.beginPath();g.arc(GW/2,GY-80,95,0,7);g.fill();mtn(.12,cm,150,.3,1);mtn(.25,cm,100,.45,4);break}
 case 4:{for(let L=0;L<2;L++){const par=L?.35:.18,w=46,k0=Math.floor(cm*par/w)-1;
  for(let k=k0;k<=k0+GW/w+3;k++){const x=k*w-cm*par,h=50+rr(k*2+L*50)*(L?130:190);g.globalAlpha=L?.5:.3;g.fillStyle='#000';g.fillRect(x,GY-h,w-6,h);
   g.globalAlpha=L?.7:.4;g.fillStyle='#ffe58a';for(let yy=GY-h+8;yy<GY-10;yy+=16)for(let xx=x+6;xx<x+w-14;xx+=14)if(rr(k*31+yy+xx)>.6)g.fillRect(xx,yy,5,7)}}g.globalAlpha=1;break}
 case 5:{for(let i=0;i<12;i++){const x=wx(rr(i)*(GW+60)-cm*(.1+rr(i+3)*.2),GW+60)-30,h=90+rr(i+5)*260,bg=g.createLinearGradient(0,GY-h,0,GY);
  bg.addColorStop(0,'rgba(255,255,255,0)');bg.addColorStop(1,col);g.globalAlpha=.35;g.fillStyle=bg;g.fillRect(x,GY-h,5,h)}
  for(let i=0;i<6;i++){const x=wx(rr(i+20)*(GW+80)-cm*.08,GW+80)-40,y=rr(i+30)*300+40;g.globalAlpha=.3;g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.moveTo(x,y-18);g.lineTo(x+16,y+12);g.lineTo(x-16,y+12);g.closePath();g.stroke()}g.globalAlpha=1;break}
 case 6:{for(let l=0;l<4;l++){g.globalAlpha=.1+.07*l;g.fillStyle=col;g.beginPath();g.moveTo(0,GY);
  for(let x=0;x<=GW;x+=10)g.lineTo(x,GY-70-l*55+Math.sin((x+cm*(.1+l*.08))/(45+l*18)+tm/(600+l*150))*(10+l*3));g.lineTo(GW,GY);g.fill()}g.globalAlpha=1;break}
 case 7:{mtn(.15,cm,170,.4,7);mtn(.3,cm,110,.5,9);
  for(let i=0;i<32;i++){const x=wx(rr(i)*(GW+40)-cm*.4+Math.sin(tm/700+i)*10,GW+40)-20,y=GY-((tm*(.02+rr(i+2)*.04)+rr(i+4)*GY)%GY);
   g.globalAlpha=.8;g.fillStyle=i%2?'#ffb347':'#ff6b35';g.beginPath();g.arc(x,y,1+rr(i+6)*2.5,0,7);g.fill()}g.globalAlpha=1;break}
 case 8:{[[.08,70,150,60],[.14,260,300,28],[.05,150,430,18]].forEach(([par,px,py,r],i)=>{const x=wx(px-cm*par,GW+200)-100,
   pg=g.createRadialGradient(x-r*.3,py-r*.3,r*.1,x,py,r);pg.addColorStop(0,'#fff');pg.addColorStop(1,col);g.globalAlpha=.4;g.fillStyle=pg;g.beginPath();g.arc(x,py,r,0,7);g.fill();
   if(i==0){g.globalAlpha=.5;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.ellipse(x,py,r*1.7,r*.4,-.3,0,7);g.stroke()}});g.globalAlpha=1;break}
 case 9:{g.save();g.translate(GW/2,GY-20);g.fillStyle='#fff';
  for(let i=0;i<14;i++){const a=Math.PI+i*Math.PI/13+Math.sin(tm/3000)*.05;g.globalAlpha=.06;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a-.05)*700,Math.sin(a-.05)*700);g.lineTo(Math.cos(a+.05)*700,Math.sin(a+.05)*700);g.fill()}g.restore();
  for(let i=0;i<18;i++){const x=wx(rr(i)*(GW+40)-cm*.15,GW+40)-20,y=rr(i+9)*(GY-120)+10,s=3+rr(i+3)*5;g.globalAlpha=.4+.6*Math.abs(Math.sin(tm/400+i));g.fillStyle='#ffe066';
   g.beginPath();g.moveTo(x,y-s*2);g.lineTo(x+s*.6,y-s*.6);g.lineTo(x+s*2,y);g.lineTo(x+s*.6,y+s*.6);g.lineTo(x,y+s*2);g.lineTo(x-s*.6,y+s*.6);g.lineTo(x-s*2,y);g.lineTo(x-s*.6,y-s*.6);g.fill()}g.globalAlpha=1;break}
 }
 g.font='34px system-ui';g.textAlign='center';g.globalAlpha=.2;
 for(let i=0;i<5;i++){const x=wx(rr(i+50)*(GW+80)-cm*.07,GW+80)-40,y=70+rr(i+60)*320+Math.sin(tm/900+i)*8;g.fillText(EMO[t],x,y)}
 g.globalAlpha=1}
function draw(){g.setTransform(SC,0,0,SC,0,0);
 const gr=g.createLinearGradient(0,0,0,GH);gr.addColorStop(0,theme[0]);gr.addColorStop(1,theme[1]);
 g.fillStyle=gr;g.fillRect(0,0,GW,GH);
 const cm=playing?P.x-CAMX:editCam;drawBg(cm);
 if(!playing){g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;const o=((cm%C)+C)%C;
  for(let x=-o;x<GW;x+=C){g.beginPath();g.moveTo(x,GY-ROWS*C);g.lineTo(x,GY);g.stroke()}
  for(let y=GY;y>=GY-ROWS*C;y-=C){g.beginPath();g.moveTo(0,y);g.lineTo(GW,y);g.stroke()}
  g.strokeStyle='#ffd23f';g.beginPath();g.moveTo(-cm,GY-ROWS*C);g.lineTo(-cm,GY);g.stroke()}
 g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,GY,GW,GH-GY);g.fillStyle=theme[2];g.fillRect(0,GY,GW,3);
 const a=Math.floor(cm/C)-1,b=a+Math.ceil(GW/C)+2;
 for(let x=a;x<=b;x++)for(let y=0;y<ROWS;y++){const t=lvl.get(Core.key(x,y));if(!t)continue;const sx=x*C-cm,sy=GY-(y+1)*C;
  if(t==1){g.fillStyle=theme[2];g.fillRect(sx,sy,C,C);g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=2;g.strokeRect(sx+1,sy+1,C-2,C-2)}
  else if(t==2){g.fillStyle='#ff4d6d';g.beginPath();g.moveTo(sx+3,sy+C);g.lineTo(sx+C/2,sy+4);g.lineTo(sx+C-3,sy+C);g.fill()}
  else if(t==3){g.fillStyle='#ffd23f';g.fillRect(sx+2,sy+C-8,C-4,8)}
  else if(t==7){const kk=Core.key(x,y);if(playing&&P.got.includes(kk))continue;const od=cur>=0&&(prog.cc[cur]||[]).includes(kk),bob=Math.sin(performance.now()/300+x)*3;g.globalAlpha=od?.35:1;g.fillStyle='#4dd0e1';g.beginPath();g.arc(sx+C/2,sy+C/2+bob,13,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2.5;g.stroke();g.lineWidth=2;g.globalAlpha=(od?.35:1)*.7;g.beginPath();g.arc(sx+C/2,sy+C/2+bob,6,0,7);g.stroke();g.globalAlpha=1}
  else{g.globalAlpha=.3;g.fillStyle=PCOL[t];g.fillRect(sx+8,sy,24,C);g.globalAlpha=.9;g.fillRect(sx+8,sy,3,C);g.fillRect(sx+29,sy,3,C);g.globalAlpha=1;if(y==5){g.font='22px system-ui';g.textAlign='center';g.fillText(PIC[t],sx+C/2,sy+C/2+8)}}}
 if(playing){
  if(cpSnap){const fx=cpSnap.x-cm+S/2;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(fx,cpSnap.y-26);g.lineTo(fx,cpSnap.y+S);g.stroke();g.fillStyle='#4dd0e1';g.beginPath();g.moveTo(fx,cpSnap.y-26);g.lineTo(fx+22,cpSnap.y-17);g.lineTo(fx,cpSnap.y-8);g.fill()}
  if(!P.dead){g.save();g.translate(P.x-cm+S/2,P.y+S/2);g.rotate(P.rot);drawPlayer(g,P.mode,S);g.restore()}
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(0,0,GW,5);g.fillStyle='#ffd23f';g.fillRect(0,0,GW*Math.min(1,P.x/P.end),5);g.font='bold 16px system-ui';g.textAlign='center';g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.6)';const pc=Math.min(100,Math.floor(100*P.x/P.end))+'%';g.strokeText(pc,GW/2,24);g.fillStyle='#fff';g.fillText(pc,GW/2,24)}
}
function loop(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;
 if(playing&&P&&!paused){acc+=dt;while(acc>=H){
   if(P.dead){deadT+=H;if(deadT>.6)retry()}
   else if(!P.won){Core.step(P,lvl,hold);Core.coins(P,lvl)}
   if(P.won&&$('end').classList.contains('hide'))win();
   if(!playing)break;acc-=H}}
 $('pause').classList.toggle('hide',!playing);$('cpb').classList.toggle('hide',!playing);$('cpb').textContent='📍 '+prog.cp+(cpSnap?' ✓':'');draw();requestAnimationFrame(loop)}
let paused=false;
function setPaused(v){if(v&&!playing)return;paused=v;hold=false;acc=0;$('pz').classList.toggle('hide',!v)}
$('pause').onclick=()=>setPaused(true);$('res').onclick=()=>setPaused(false);
$('rst').onclick=()=>start();
$('pm').onclick=()=>{setPaused(false);if(editing){playing=false;$('mode').textContent='▶ Tester'}else show(false)};
addEventListener('keydown',e=>{if(e.code=='Escape'||e.code=='KeyP'){if(e.target===ta||e.target===$('nm'))return;setPaused(!paused)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});
buildMenu();requestAnimationFrame(loop);
</script></body></html>
